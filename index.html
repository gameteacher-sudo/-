 else{o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(40,n+d);o.connect(g)}
 g.connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}

function throwP(x,y,wi,k,sub,sc){proj.push({x,y0:y,y,wi,k,sub,sc,t:0})}
const TC=['#fff','#d9a27a','#cfd6dd','#e6edf5','#ff9a2e','#ffd24a','#ff9a2e','#35d0ff','#ff7a1e','#b46bff','#9cc04a','#ff4fd8','#ffe94a','#ff9ae8','#4fffd6','#ffd24a'];
const fmt=n=>n>=1e8?+(n/1e8).toFixed(1)+'億':n>=1e4?+(n/1e4).toFixed(1)+'万':n.toLocaleString();
const GL={};function glow(c){return GL[c]||(GL[c]=sprite(64,64,()=>{const g=ctx.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,64,64)}))}
let fireN=0;
function fire(){const w=WP[S.eq],c=TC[S.eq],t=Math.min(1,S.eq/15);cd=w.cd;pl=.12;throwP(60,GROUND+2,S.eq,w.k,false,w.sc);
 snd(300-S.eq*8,.1+t*.15,.05+t*.1);
 shake=Math.max(shake,1+S.eq*.5);if(S.eq>=5)flash=Math.max(flash,.04+t*.12);
 if(fxs.length<8)fxs.push({x:66,y:GROUND+2,l:.2,R:30+S.eq*5,c});
 if(parts.length<140)for(let i=0;i<4+S.eq*2;i++)parts.push({x:66,y:GROUND+2,vx:150+Math.random()*500,vy:(Math.random()-.5)*400,l:.35,s:2+Math.random()*3,c:i%2?c:'#fff',star:i%3==0,tr:1});
 if(S.eq>=6&&++fireN%3==0&&texts.length<8)texts.push({x:90,y:GROUND-40,s:w.n+'!',l:.6,sc:.45,rot:-.1,c});
}
const ONO=['ドガッ!','バキッ!','ズバン!','ガツン!','ボコッ!'],ONOB=['ドカーン!!','ズドォン!!','メリメリ!!'];
function hit(k,o){
 const cnt=o.cnt||1;combo+=cnt;comboT=1.6;pop=1;
 const mult=1+Math.floor(combo/25),ke=Math.min(k,o.sub?8:30),big=ke>=5||o.ult,hy=GROUND-BH*Math.min(ke,5)/2;
 for(let i=0;i<k;i++){if(!stack.length)fill();const b=stack.shift();if(i<16&&flying.length<40)flying.push({b,x:CX-BW/2,y:b.y,vx:550+Math.random()*700+i*30,vy:-300-Math.random()*500-(o.ult?300:0),r:0,vr:(Math.random()-.3)*16})}
 fill();
 S.pts+=k*mult;S.tot+=k;dirtySave=true;hudDirty=true;
 const q=o.sub?.5:1;
 shake=Math.max(shake,o.sub?Math.min(7,2+ke*.6):Math.min(26,4+ke*1.2)+(o.ult?14:0));
 if(!o.sub)freeze=Math.max(freeze,Math.min(.14,.035+ke*.005));
 if(big)flash=Math.max(flash,o.ult?.9:.3);
 const hx=CX-BW/2;
 if(parts.length<140)for(let i=0;i<(8+ke*3)*q;i++)parts.push({x:hx,y:hy+(Math.random()-.5)*BH*Math.min(ke,4),vx:(Math.random()-.1)*800,vy:(Math.random()-.8)*600,l:.6,s:2+Math.random()*4,c:[TC[o.wi||0],'#ffd24a','#fff'][i%3],star:i%2});
 if(parts.length<140)for(let i=0;i<2+ke*q;i++)parts.push({x:hx+Math.random()*30,y:hy+(Math.random()-.5)*60,vx:(Math.random()-.5)*160,vy:-Math.random()*90,l:.7,s:8,c:'rgba(150,140,120,.6)',dust:1});
 if(fxs.length<4)fxs.push({x:hx,y:hy,l:.22,R:60+ke*8,c:TC[o.wi||0]});
 if(texts.length<8){
  if(!o.sub||k>=3)texts.push({x:hx+60+Math.random()*30,y:hy-30,s:(big?ONOB:ONO)[Math.random()*(big?3:5)|0],l:.7,sc:.8+Math.min(1.2,ke*.06),rot:(Math.random()-.5)*.5,c:big?'#ff3b1d':'#ffd24a'});
  texts.push({x:hx+20,y:hy,s:'+'+k*mult,l:.8,sc:.55,rot:0,c:'#fff',up:1})}
 snd(big?200:600,big?.35:.12,big?.35:.18,1);if(big)snd(120,.4,.3);
}
function ultGo(){if(charge<1||ult)return;charge=0;ult={t:0,done:false};snd(90,.8,.3)}
function team(dt){
 if(S.subs){const rate=S.subs/1.7,V=Math.min(rate,14),ratio=rate/V;acc1+=dt*V;
  while(acc1>=1){acc1--;if(proj.length<60){const p=subPos(Math.random()*Math.min(S.subs,10)|0);throwP(p.x+8,p.y-24,0,Math.max(1,Math.round((1+S.train)*ratio)),true,.75)}}}
 if(S.giants){const rate=S.giants/2.2,V=Math.min(rate,3),ratio=rate/V;acc2+=dt*V;
  while(acc2>=1){acc2--;if(proj.length<60)throwP(GX[Math.random()*Math.min(S.giants,2)|0]+24,GROUND-4,2,Math.max(1,Math.round((5+2*S.train)*ratio)),true,1.5)}}
}
function loop(now){
 const rdt=Math.min(.05,(now-last)/1000);last=now;clock+=rdt;
 if(freeze>0)freeze-=rdt;
 const dt=freeze>0?0:rdt*ts;
 if(!ult)charge=Math.min(1,charge+rdt/14);
 const cp=Math.round(charge*100);if(cp!==lastCharge){lastCharge=cp;ub.style.setProperty('--p',cp);ub.classList.toggle('rdy',cp>=100)}
 if(ult){ult.t+=rdt;ts=ult.t<.7?.25:1;
  if(ult.t>=.7&&!ult.done){ult.done=true;hit(Math.min(150,40+S.subs*2+S.giants*10),{ult:true})}
  if(ult.t>1.5){ult=null;ts=1}}
 cd-=dt;pl-=dt;
 if((hold||key)&&cd<=0&&!ult)fire();
 team(dt);
 stack.forEach((b,i)=>b.y+=(slotY(i)-b.y)*Math.min(1,dt*18));
 let sk=0,sc=0;
 for(let i=proj.length-1;i>=0;i--){const p=proj[i];p.x+=1200*dt;p.t+=dt;const f=Math.min(1,(p.x-60)/(CX-BW/2-60));p.y=p.y0+(GROUND-BH/2-p.y0)*f;if(!p.sub&&p.wi>0&&parts.length<140)parts.push({x:p.x-10,y:p.y+(Math.random()-.5)*10,vx:-60,vy:(Math.random()-.5)*60,l:.3,s:3+p.wi*.5,c:TC[p.wi],tr:1});
  if(p.x>=CX-BW/2-6){proj.splice(i,1);if(p.sub){sk+=p.k;sc++}else hit(p.k,{wi:p.wi})}}
 if(sk)hit(sk,{sub:true,cnt:sc});
 for(let i=flying.length-1;i>=0;i--){const f=flying[i];f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=1700*dt;f.r+=f.vr*dt;if(f.y>H+80||f.x>W+200)flying.splice(i,1)}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.dust||p.tr?0:1300)*dt;p.l-=dt;if(p.dust)p.s+=40*dt;if(p.tr)p.s*=1-dt*4;if(p.l<=0)parts.splice(i,1)}
 for(let i=texts.length-1;i>=0;i--){const q=texts[i];q.y-=(q.up?70:20)*dt;q.l-=dt;if(q.l<=0)texts.splice(i,1)}
 for(let i=fxs.length-1;i>=0;i--){fxs[i].l-=dt;if(fxs[i].l<=0)fxs.splice(i,1)}
 comboT-=rdt;if(comboT<=0)combo=0;pop=Math.max(0,pop-rdt*6);flash=Math.max(0,flash-rdt*2.5);shake*=Math.pow(.0004,rdt);
 hudT-=rdt;if(hudT<=0){hudT=.12;if(hudDirty){hudDirty=false;document.getElementById('pts').textContent=S.pts.toLocaleString();document.getElementById('tot').textContent=S.tot.toLocaleString()}}
 shopT-=rdt;if(shopT<=0){shopT=.3;updateShop();if(dirtySave&&shopT>0)save2+=1;if(save2>=7){save2=0;save()}}
 draw();requestAnimationFrame(loop);
}
let last=performance.now(),save2=0;
function bgDraw(){
 ctx.fillStyle='#d9cfb8';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#c4b898';ctx.fillRect(0,GROUND-110,W,110);
 ctx.fillStyle='#e8e2d2';ctx.fillRect(0,0,W,16);
 for(const x of[60,180,300]){ctx.fillStyle='#fffbe0';ctx.fillRect(x-24,4,48,8)}
 ctx.lineWidth=3;ctx.strokeStyle='#2b1d16';ctx.fillStyle='#8fc1dc';ctx.fillRect(14,50,92,120);ctx.strokeRect(14,50,92,120);
 ctx.fillStyle='#5b7a92';[[22,110,16,60],[42,90,18,80],[64,120,14,50],[82,100,16,70]].forEach(r=>ctx.fillRect(...r));
 ctx.beginPath();ctx.moveTo(60,50);ctx.lineTo(60,170);ctx.moveTo(14,110);ctx.lineTo(106,110);ctx.stroke();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(318,70,24,0,7);fs();ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(318,70);ctx.lineTo(318,55);ctx.moveTo(318,70);ctx.lineTo(330,70);ctx.stroke();
 ctx.fillRect(130,60,80,54);ctx.strokeRect(130,60,80,54);
 ctx.fillStyle='#d9381e';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('今月も',170,82);ctx.fillText('ノルマ達成!',170,100);
 ctx.fillStyle='#5a5348';ctx.fillRect(0,GROUND,W,H-GROUND);ctx.fillStyle='#2b1d16';ctx.fillRect(0,GROUND,W,4);
 ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1.5;for(let x=-40;x<W+80;x+=60){ctx.beginPath();ctx.moveTo(x,GROUND+4);ctx.lineTo(x-30,H);ctx.stroke()}
}
const BG=sprite(W,H,bgDraw);
function outText(s,x,y,lw){ctx.lineWidth=lw;ctx.strokeStyle='#2b1d16';ctx.strokeText(s,x,y);ctx.fillText(s,x,y)}
function draw(){
 ctx.save();ctx.clearRect(0,0,W,H);
 if(shake>.4)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 ctx.drawImage(BG,0,0,W,H);
 for(const b of stack)if(b.y>-BH)drawBlock(b,CX-BW/2,b.y,0,0);
 for(const f of flying)drawBlock(f.b,f.x,f.y,f.r,1);
 for(let i=Math.min(S.subs,10)-1;i>=0;i--){const p=subPos(i);emp(p.x,p.y,.62,['#4a5a7a','#6a4a5a','#4a6a5a','#7a6a4a'][i%4],'#3a6ad9',Math.sin(clock*4+i*1.7)>.85?1:0,HAIR[i%4])}
 for(let i=Math.min(S.giants,2)-1;i>=0;i--)emp(GX[i],GROUND+54,1.65,'#5a2a3a','#ffd24a',Math.sin(clock*3+i*2)>.8?1:0,'#222',1.35);
 emp(34,GROUND+46,1.4,'#8a2a2a','#ffd24a',pl,'#222');
 ctx.font='bold 12px sans-serif';ctx.textAlign='left';ctx.fillStyle='#fff';
 if(S.subs>10)outText('部下×'+S.subs,56,H-3,3);
 if(S.giants>2)outText('巨大×'+S.giants,100,GROUND-34,3);
 for(const p of proj){if(p.wi>=4&&!p.sub){ctx.globalCompositeOperation='lighter';const r=40+p.wi*6;ctx.globalAlpha=.8;ctx.drawImage(glow(TC[p.wi]),p.x-r,p.y-r,r*2,r*2);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}ctx.save();ctx.translate(p.x,p.y);if(SPIN[p.wi])ctx.rotate(p.t*18);ctx.scale(p.sc,p.sc);wpn(p.wi,p.t);ctx.restore()}
 for(const f of fxs){ctx.save();ctx.translate(f.x,f.y);ctx.strokeStyle=f.c||'#fff';ctx.lineWidth=3;ctx.globalAlpha=Math.min(1,f.l*4);ctx.beginPath();for(let i=0;i<14;i++){const a=i*Math.PI/7;ctx.moveTo(Math.cos(a)*18,Math.sin(a)*18);ctx.lineTo(Math.cos(a)*f.R,Math.sin(a)*f.R)}ctx.stroke();ctx.restore()}
 for(const p of parts){ctx.globalAlpha=Math.min(1,p.l*2);ctx.fillStyle=p.c;if(p.star){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.l*12);ctx.fillRect(-p.s,-p.s/3,p.s*2,p.s*.66);ctx.fillRect(-p.s/3,-p.s,p.s*.66,p.s*2);ctx.restore()}else{ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill()}}
 ctx.globalAlpha=1;
 if(ult&&ult.t>.7){const a=Math.max(0,1-(ult.t-.7)/.8),h=BH*5*(.6+a*.4);ctx.globalAlpha=a;const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'#fff');g.addColorStop(1,'#ff7a1e');ctx.fillStyle=g;ctx.fillRect(60,GROUND-h/2-30,W,h);ctx.globalAlpha=1}
 ctx.textAlign='center';ctx.font='36px "Dela Gothic One","Hiragino Sans",sans-serif';ctx.lineJoin='round';
 for(const q of texts){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);const s=q.sc*(q.up?1:1+Math.max(0,q.l-.55)*5);ctx.scale(s,s);ctx.globalAlpha=Math.min(1,q.l*3);ctx.fillStyle=q.c;outText(q.s,0,0,7);ctx.restore()}
 ctx.globalAlpha=1;
 if(combo>=3){ctx.save();ctx.translate(W-14,34);ctx.textAlign='right';const s=1+pop*.35;ctx.scale(s,s);ctx.font='34px "Dela Gothic One",sans-serif';ctx.fillStyle=combo>=25?'#ff5a2e':'#ffd24a';outText(combo,0,0,6);ctx.font='13px sans-serif';ctx.fillStyle='#fff';outText('COMBO'+(combo>=25?' ×'+(1+Math.floor(combo/25)):''),0,16,4);ctx.restore()}
 if(ult&&ult.t<1){const t=ult.t;ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2+Math.max(0,.15-t)*900,H/2-40);ctx.rotate(-.12);ctx.fillStyle='#d9381e';ctx.fillRect(-W,-34,W*2,68);ctx.fillStyle='#fff';ctx.font='32px "Dela Gothic One",sans-serif';ctx.fillText('必殺!退職届ブッパ!',0,12);ctx.restore()}
 if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(-20,-20,W+40,H+40)}
 ctx.restore();
}

/* ---- shop ---- */
const cardsEl=document.getElementById('cards');let tab=0,cards=[];
const TEAM=[
 {id:'hire',n:'部下を雇う',ic:c=>emp(32,58,1.3,'#4a5a7a','#3a6ad9',0,'#3a3a3a'),ef:()=>`いま${S.subs}人・自動で投げる`,cost:hireCost,buy(){S.subs++}},
 {id:'giant',n:'巨大部下',ic:c=>emp(32,60,1.45,'#5a2a3a','#ffd24a',0,'#222',1.35),ef:()=>`いま${S.giants}人・1発5段`,cost:giantCost,buy(){S.giants++}},
 {id:'train',n:'部下を研修',ic:c=>{ctx.fillStyle='#d9381e';ctx.lineWidth=3;ctx.strokeStyle='#2b1d16';rr(14,12,36,42,4);fs();ctx.fillStyle='#fff';ctx.fillRect(20,20,24,8);ctx.fillStyle='#ffd24a';ctx.fillRect(20,34,24,4);ctx.fillRect(20,42,16,4)},ef:()=>`Lv${S.train}・部下の威力UP`,cost:trainCost,buy(){S.train++}}
];
function icon(fn){const c=document.createElement('canvas');c.width=64*dpr;c.height=64*dpr;const o=ctx;ctx=c.getContext('2d');ctx.scale(dpr,dpr);fn();ctx=o;return c}
function buildShop(){
 cardsEl.innerHTML='';cards=[];
 const list=tab===0?WP.map((w,i)=>({n:w.n,ef:()=>`${w.k}段・${(1/w.cd).toFixed(1)}回/秒`,ic:()=>{ctx.translate(32+(i===8?8:0),32);const s=[2,2,1.7,1.7,1.5,1.9,1.5,1.7,1.1,1.4,1.2,1.3,1.1,1.3,1.3,1.2][i];ctx.scale(s,s);wpn(i,0,1)},w:i})):TEAM;
 list.forEach(it=>{
  const b=document.createElement('button');b.className='card';
  b.append(icon(it.ic));
  b.insertAdjacentHTML('beforeend',`<span class="nm">${it.n}</span><span class="ef"></span><span class="pr"></span>`);
  b._it=it;b.onclick=()=>buy(it);cardsEl.append(b);cards.push(b)});
 updateShop();
}
function buy(it){
 if(it.w!=null){const i=it.w;if(S.owned[i])S.eq=i;else if(S.pts>=WP[i].cost){S.pts-=WP[i].cost;S.owned[i]=1;S.eq=i;snd(900,.2,.1)}}
 else{const c=it.cost();if(S.pts>=c){S.pts-=c;it.buy();snd(800,.15,.1)}}
 hudDirty=true;save();updateShop();
}
function updateShop(){
 for(const b of cards){const it=b._it;let txt,can,eq=false,lock=false;
  if(it.w!=null){const w=WP[it.w];if(S.eq===it.w){txt='装備中';eq=true}else if(S.owned[it.w])txt='装備する';else{txt=fmt(w.cost)+' pt';can=S.pts>=w.cost;lock=!can}}
  else{const c=it.cost();txt=fmt(c)+' pt';can=S.pts>=c;lock=!can}
  const ef=it.ef(),e=b.children[2],p=b.children[3];
  if(e.textContent!==ef)e.textContent=ef;if(p.textContent!==txt)p.textContent=txt;
  b.classList.toggle('eq',eq);b.classList.toggle('lock',lock);b.classList.toggle('can',!!can&&!eq)}
}
document.getElementById('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;tab=+t.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));buildShop()});
const ub=document.getElementById('ult');
ub.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();ultGo()});
document.getElementById('stage').addEventListener('pointerdown',e=>{hold=true;e.preventDefault()});
addEventListener('pointerup',()=>hold=false);addEventListener('pointercancel',()=>hold=false);
addEventListener('keydown',e=>{if(e.code==='Space'){key=true;e.preventDefault()}if(e.code==='KeyZ'||e.code==='Enter')ultGo()});
addEventListener('keyup',e=>{if(e.code==='Space')key=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
document.getElementById('share').addEventListener('click',async()=>{
 const url=location.origin+location.pathname,wn=WP[S.eq].n;
 const l1=`上司を${S.tot.toLocaleString()}人落とした!`,l2=`武器:${wn} / 部下${S.subs}人・巨大${S.giants}人`;
 const text=l1+'\n'+l2+'\n#上司落とし\n'+url;
 try{
  const c=document.createElement('canvas'),w=720,h=1040;c.width=w;c.height=h;const x=c.getContext('2d');
  x.drawImage(cv,0,0,w,h);x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,h-250,w,250);
  x.textAlign='center';x.fillStyle='#ffd24a';x.font='60px "Dela Gothic One",sans-serif';x.fillText('上司落とし',w/2,h-170);
  x.fillStyle='#fff';x.font='40px "Dela Gothic One",sans-serif';x.fillText(l1,w/2,h-110);
  x.font='30px sans-serif';x.fillText(l2,w/2,h-55);
  const blob=await new Promise(r=>c.toBlob(r,'image/png')),file=new File([blob],'jyoushi.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({text,files:[file]});return}
  if(navigator.share){await navigator.share({text});return}
 }catch(err){if(err&&err.name==='AbortError')return}
 window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text),'_blank');
});
buildShop();requestAnimationFrame(loop);
</script>
